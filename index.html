<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADM Arena 360</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <main class="shell">
    <header class="hero">
      <div class="eyebrow">DIA DO ADMINISTRADOR • 09 DE SETEMBRO</div>
      <h1>ADM ARENA <span>360</span></h1>
      <p>Guerra de Gestão — sua empresa, suas decisões, suas consequências.</p>
    </header>

    <section class="card glass">
      <div class="mode-grid">
        <button class="mode" onclick="location.href='professor.html'">
          <span class="icon">🎮</span>
          <strong>PAINEL DO PROFESSOR</strong>
          <small>Criar sala, controlar rodadas e lançar crises.</small>
        </button>
        <button class="mode" onclick="location.href='empresa.html'">
          <span class="icon">🏢</span>
          <strong>ENTRAR COMO EMPRESA</strong>
          <small>Entrar pelo código da sala e disputar o mercado.</small>
        </button>
        <button class="mode" onclick="location.href='ranking.html'">
          <span class="icon">🏆</span>
          <strong>TELÃO / RANKING</strong>
          <small>Placar para projetar durante a partida.</small>
        </button>
      </div>
    </section>

    <section class="feature-row">
      <div>💰 Caixa em tempo real</div><div>🤝 Negociações</div><div>🚨 Crises</div>
      <div>🔨 Leilões</div><div>⚡ Batalha ADM</div><div>🏆 Ranking</div>
    </section>

    <footer>3ª Série • Técnico em Administração</footer>
  </main>
</body>
</html>
